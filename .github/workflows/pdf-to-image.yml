name: Convert PDF to Image

on:
  push:
    paths:
      - '**.pdf'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pdf-to-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install Pillow pdf2image

      - name: Delete old images and convert PDFs fresh
        run: |
          python3 << 'EOF'
          import os
          from pdf2image import convert_from_path
          from PIL import Image, ImageChops

          STANDARD_WIDTH = 1100

          def crop(img):
              bg = Image.new(img.mode, img.size, img.getpixel((0, 0)))
              diff = ImageChops.difference(img, bg)
              bbox = diff.getbbox()
              return img.crop(bbox) if bbox else img

          # Step 1: find all PDFs and their expected output names first
          pdf_files = []
          for root, dirs, files in os.walk('.'):
              if '.git' in root:
                  continue
              for filename in files:
                  if filename.lower().endswith('.pdf'):
                      pdf_files.append(os.path.join(root, filename))

          # Step 2: delete any existing .jpg whose name matches a PDF we're about to regenerate
          for filepath in pdf_files:
              root = os.path.dirname(filepath)
              name = os.path.basename(filepath).replace('.pdf', '')
              for f in os.listdir(root or '.'):
                  if f.startswith(name + '_') and f.lower().endswith('.jpg'):
                      old_path = os.path.join(root, f)
                      os.remove(old_path)
                      print(f'Deleted old: {old_path}')
                  elif f == name + '.jpg':
                      old_path = os.path.join(root, f)
                      os.remove(old_path)
                      print(f'Deleted old: {old_path}')

          # Step 3: convert each PDF fresh
          for filepath in pdf_files:
              root = os.path.dirname(filepath)
              name = os.path.basename(filepath).replace('.pdf', '')
              try:
                  pages = convert_from_path(filepath, dpi=150)
                  for i, img in enumerate(pages):
                      img = crop(img)
                      w = STANDARD_WIDTH / img.size[0]
                      h = int(img.size[1] * w)
                      img = img.resize((STANDARD_WIDTH, h))
                      out_name = f"{name}.jpg" if len(pages) == 1 else f"{name}_{i+1}.jpg"
                      out_path = os.path.join(root, out_name)
                      img.save(out_path, format="JPEG", quality=85)
                      print(f'Created: {out_path}')
              except Exception as e:
                  print(f'Error processing {filepath}: {e}')
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git add -A -- '*.jpg'
            if git diff --staged --quiet; then
              echo "Nothing to commit"
              break
            fi
            git commit -m "Refresh cropped images [skip ci]"
            git pull --rebase origin main
            if git push; then
              echo "Push succeeded"
              break
            else
              echo "Push failed, retrying ($i/5)..."
              sleep 5
            fi
          done
