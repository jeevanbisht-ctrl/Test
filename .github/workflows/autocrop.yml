name: Convert PDF to Image

on:
  push:
    paths:
      - '**.pdf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install Pillow pdf2image

      - name: Convert PDFs to cropped images
        run: |
          python3 << 'EOF'
          import os
          from pdf2image import convert_from_path
          from PIL import Image, ImageChops

          STANDARD_WIDTH = 1100

          def crop(img):
              bg = Image.new(img.mode, img.size, img.getpixel((0, 0)))
              diff = ImageChops.difference(img, bg)
              bbox = diff.getbbox()
              return img.crop(bbox) if bbox else img

          for root, dirs, files in os.walk('.'):
              if '.git' in root:
                  continue
              for filename in files:
                  if filename.lower().endswith('.pdf'):
                      filepath = os.path.join(root, filename)
                      name = filename.replace('.pdf', '')
                      try:
                          pages = convert_from_path(filepath, dpi=150)
                          for i, img in enumerate(pages):
                              img = crop(img)
                              w = STANDARD_WIDTH / img.size[0]
                              h = int(img.size[1] * w)
                              img = img.resize((STANDARD_WIDTH, h))
                              out_name = f"{name}.jpg" if len(pages) == 1 else f"{name}_{i+1}.jpg"
                              out_path = os.path.join(root, out_name)
                              img.save(out_path, format="JPEG", quality=85)
                              print(f'Created: {out_path}')
                      except Exception as e:
                          print(f'Error processing {filepath}: {e}')
          EOF

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.jpg'
          git diff --staged --quiet || git commit -m "Auto-convert PDF to cropped image [skip ci]"
          git push
