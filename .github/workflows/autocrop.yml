name: Auto-crop image whitespace

on:
  push:
    paths:
      - '**.jpg'
      - '**.jpeg'
      - '**.png'

jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Crop whitespace from images
        run: |
          python3 << 'EOF'
          import os
          from PIL import Image, ImageChops

          for root, dirs, files in os.walk('.'):
              # skip .git folder
              if '.git' in root:
                  continue
              for filename in files:
                  if filename.lower().endswith(('.jpg', '.jpeg', '.png')):
                      filepath = os.path.join(root, filename)
                      try:
                          img = Image.open(filepath)
                          rgb = img.convert('RGB')
                          bg = Image.new('RGB', rgb.size, (255, 255, 255))
                          diff = ImageChops.difference(rgb, bg)
                          bbox = diff.getbbox()
                          if bbox:
                              left, top, right, bottom = bbox
                              left = max(0, left - 5)
                              top = max(0, top - 5)
                              right = min(img.width, right + 5)
                              bottom = min(img.height, bottom + 5)
                              cropped = img.crop((left, top, right, bottom))
                              cropped.save(filepath, quality=95)
                              print(f'Cropped: {filepath}')
                          else:
                              print(f'No whitespace detected: {filepath}')
                      except Exception as e:
                          print(f'Error processing {filepath}: {e}')
          EOF

      - name: Commit cropped images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.jpg' '*.jpeg' '*.png'
          git diff --staged --quiet || git commit -m "Auto-crop image whitespace [skip ci]"
          git push
